<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<title>ARKA AI | B2B Intelligence</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
background:#0b0b0b;
color:white;
font-family:tahoma,Arial;

}


.container{

width:90%;
max-width:650px;
margin:50px auto;
background:#151515;
padding:35px;
border-radius:20px;

}


.logo{

text-align:center;
font-size:45px;
font-weight:bold;
color:#d4af37;

}


.subtitle{

text-align:center;
font-size:20px;
margin-bottom:30px;

}


input{

width:100%;
padding:15px;
margin-top:12px;
border-radius:10px;
border:none;
font-size:16px;

}


button{

width:100%;
padding:15px;
margin-top:20px;
background:#d4af37;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;

}


.result{

margin-top:25px;
background:#222;
padding:20px;
border-radius:15px;

}


.card{

background:#333;
padding:15px;
margin-top:15px;
border-radius:10px;

}


.score{

color:#d4af37;
font-size:20px;
font-weight:bold;

}


</style>


</head>


<body>


<div class="container">


<div class="logo">
ARKA AI
</div>


<div class="subtitle">
سامانه هوشمند تطبیق تجارت B2B
</div>



<input id="product" placeholder="نام محصول مثال: فولاد">


<input id="quantity" placeholder="مقدار">


<input id="budget" placeholder="بودجه">



<button onclick="analyze()">

تحلیل توسط ARKA AI

</button>



<div class="result" id="result">

منتظر درخواست...

</div>


</div>




<script>


async function analyze(){


let product =
document.getElementById("product").value;


let quantity =
document.getElementById("quantity").value;


let budget =
document.getElementById("budget").value;




// ایجاد درخواست خرید

let createResponse =
await fetch(
"/trade-request",
{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

trader_name:"کاربر Demo",

product_needed:product,

quantity:Number(quantity),

budget:Number(budget)

})

});



let requestData =
await createResponse.json();




// دریافت پیشنهادهای AI

let response =
await fetch(

`/trade-request/${requestData.request_id}/recommend`

);



let data =
await response.json();




let html = "";



data.recommendations.forEach(
(item,index)=>{


html += `


<div class="card">


<h3>

رتبه ${index+1}

<br>

${item.supplier}

</h3>



<div class="score">

${item.score}%

</div>



<p>

دلایل:

<br>

${item.reasons.join("<br>")}

</p>


</div>


`;


});





document.getElementById("result").innerHTML =

`

<h3>
نتیجه تحلیل ARKA
</h3>


<p>
محصول:
${data.product}
</p>


${html}


`;



}



</script>



</body>

</html>
